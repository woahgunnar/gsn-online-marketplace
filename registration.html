<!doctype html>
<html lang="en">
  <head>
    <!--
	Milestone 2
	Author: Sebastian Jeansonne
	File: registration.html
	-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sebastian Jeansonne" />
    <meta name="description" content="Register New User" />
    <title>Olde-Catalog - Registration</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/registration.css" />

    <script src="js/registration.js" defer></script>
  </head>

  <body>
    <!-- HEADER AND NAVIGATION -->
    <header>
      <div class="header-content">
        <div class="logo-window">
          <h1>
            <a href="index.html"
              ><img src="images/logo.webp" width="300" height="150" alt="logo"
            /></a>
          </h1>
        </div>

        <!-- navigation menu -->
        <nav aria-label="Main navigation">
          <a href="login.html">Sign in</a>
          <a href="index.html">Browse</a>
          <a href="messages.html">Messages</a>
          <a href="profile.php">Profile</a>
          <a href="cart.html">Cart</a>
        </nav>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="wooden-frame">
      <div class="parchment-panel">
        <img src="images/iron-rivet.png" class="nail-left" alt="" />
        <img src="images/iron-rivet.png" class="nail-right" alt="" />

        <!-- page heading -->
        <div class="registration-heading">
          <h2>Join the Handful of Merchants Already Using Our Platform</h2>
          <h3>
            <em>Create your Olde-Catalog account and begin trading today!</em>
          </h3>
        </div>

        <!-- registration layout -->
        <div class="registration-layout">
          <!-- registration artwork -->
          <div class="registration-image">
            <img
              src="images/pig-crest.png"
              alt="A shield depicting a pig juxtaposed by two scenes: 
				        his front is surrounded by wealth and opulence, his rear surrounded by slop and squalor."
            />
          </div>

          <!-- registration form -->
          <section class="registration-panel">
            <h3>Register - New Merchant</h3>
            <form id=registrationForm class="registration-form" novalidate>
              <!-- username field -->
              <div class="registration-field full-width">
                <label for="username">Username</label>
                <input
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  minlength="3"
                  maxlength="24"
                  required
                  aria-describedby="username-error"
                />
                <small id="username-error" class="registration-error"
                  >Username must be between 3-24 characters</small
                >
              </div>

              <!-- email field -->
              <div class="registration-field">
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>

              <!-- phone field -->
              <div class="registration-field">
                <label for="phone">Phone Number</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  inputmode="tel"
                  placeholder="XXX-XXX-XXXX"
                />
              </div>

              <!-- password field -->
              <div class="registration-field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                  aria-describedby="password-error"
                />
                <small id="password-error" class="registration-error"
                  >Password must be at least 8 characters.</small
                >
              </div>

              <!-- confirm password field -->
              <div class="registration-field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  required
                />
              </div>

              <!-- country field -->
              <div class="registration-field">
                <label for="country">Country</label>
                <input
                  type="text"
                  id="country"
                  name="country"
                  value="US"
                  readonly
                />
              </div>

              <!-- state field -->
              <div class="registration-field">
                <label for="state">State</label>
                <select id="state" name="state" required>
                  <option value="">Select a state</option>
                  <option value="AL">AL</option>
                  <option value="AK">AK</option>
                  <option value="AZ">AZ</option>
                  <option value="AR">AR</option>
                  <option value="CA">CA</option>
                  <option value="CO">CO</option>
                  <option value="CT">CT</option>
                  <option value="DE">DE</option>
                  <option value="FL">FL</option>
                  <option value="GA">GA</option>
                  <option value="HI">HI</option>
                  <option value="ID">ID</option>
                  <option value="IL">IL</option>
                  <option value="IN">IN</option>
                  <option value="IA">IA</option>
                  <option value="KS">KS</option>
                  <option value="KY">KY</option>
                  <option value="LA">LA</option>
                  <option value="ME">ME</option>
                  <option value="MD">MD</option>
                  <option value="MA">MA</option>
                  <option value="MI">MI</option>
                  <option value="MN">MN</option>
                  <option value="MS">MS</option>
                  <option value="MO">MO</option>
                  <option value="MT">MT</option>
                  <option value="NE">NE</option>
                  <option value="NV">NV</option>
                  <option value="NH">NH</option>
                  <option value="NJ">NJ</option>
                  <option value="NM">NM</option>
                  <option value="NY">NY</option>
                  <option value="NC">NC</option>
                  <option value="ND">ND</option>
                  <option value="OH">OH</option>
                  <option value="OK">OK</option>
                  <option value="OR">OR</option>
                  <option value="PA">PA</option>
                  <option value="RI">RI</option>
                  <option value="SC">SC</option>
                  <option value="SD">SD</option>
                  <option value="TN">TN</option>
                  <option value="TX">TX</option>
                  <option value="UT">UT</option>
                  <option value="VT">VT</option>
                  <option value="VA">VA</option>
                  <option value="WA">WA</option>
                  <option value="WV">WV</option>
                  <option value="WI">WI</option>
                  <option value="WY">WY</option>
                </select>
              </div>

              <!-- address field -->
              <div class="registration-field">
                <label for="address">Address</label>
                <input
                  id="address"
                  name="address"
                  type="text"
                  autocomplete="street-address"
                  placeholder="Optional"
                />
              </div>

              <!-- submit button -->
              <div class="registration-action">
                <button class="leather-button" type="submit">Register</button>
              </div>

              <!-- response message -->
              <p
                class="registration-response"
                id="registration-response"
                role="status"
                aria-live="polite"
              ></p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-content">
        <p>&copy; 2026 Olde-Catalog</p>
        <a href="support.html">Help & Support</a>
      </div>
    </footer>
  </body>
</html>
