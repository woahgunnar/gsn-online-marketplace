<!doctype html>
<html lang="en">

		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="author" content="Sebastian Jeansonne" />
		<meta name="description" content="Register New User" />
		<title>Register New User</title>
	
		<link rel="stylesheet" href="registration.css" />
		<link rel="stylesheet" href="/*UNIVERSAL STYLESHEET GOES HERE*/" />
	</head>
	
	<body>
		 <div class="registration_page">
			<header>
				<a class="logo" href="logo.png" aria-label="Site homepage">logo</a>

				<nav> <!--navbar-->
					<a href="login.html">Login</a>
					<a href="browse.html">Browse</a>
					<a href="messages.html">Messages</a>
					<a href="profile.html">Profile</a>
					<a href="support.html">Support</a>
					<a href="saved.html">Saved Items</a>
				</nav>
			</header>
			<main>
			<section class = "registration_image" aria-label="big register image">
				image
			</section>

			<section class="registration_panel">
				<h1>Register - New User</h1>
				
				<form class= "registration_form">
					<div class="registration_field">
						<label for="username">Username</label>
						<input id="username" name="username" type="text"
							autocomplete="username" minlength="3" maxlength="24"
							required aria-describedby="username_error">
						<small id="username_error" class="registration_error">Username must be between 3–24 characters</small>
					</div>
		
					<div class="registration_field">
						<label for="email">E-mail</label>
						<input id="email" name="email" type="email" autocomplete="email" required>
					</div>
			
					<div class="registration_field">
						<label for="phone">Phone Number</label>
							<input id ="phone" name="phone" type="tel" autocomplete="tel"
								inputmode="tel" placeholder="XXX-XXX-XXXX">
					</div>
				
					<div class="registration_field">
						<label for="password">Password</label>
						<input id="password" name="password" type="password"
							autocomplete="new_password" minlength="8" required
							aria-describedby="password_error">
						<small id="password_error" class="registration_error">Password must be at least 8 characters.</small>
					</div>

					<div class="registration_field">
						<label for="confirm_password">Confirm Password</label>
						<input id=confirm_password" name ="confirmPassword" type="password"
							autocomplete="new_password" required>
					</div>
			
					<div class="registration_field">
						<label for="country">Country</label>
						<select id="country" name="country" required>
							<option value="">Choose</option>
							<option value="NK">North Korea</option>
							<option value="SK">South Korea</option>
							<option value="EK">East Korea</option>
							<option value="WK">West Korea</option>
							<option value="PT">Petoria</option>
						</select>
					</div>

					<div class="registration_field">
						<label for = "state">State</label>
						<input id="state" name="state" type="state" required>
					</div>

					<div class="registration_field">
						<label for="address">Address</label>
						<input id="address" name="address" type="text
							autocomplete="street_address" placeholder="Optional">
					</div>
					
					<div class="registration_action">
						<button class="registration_submit" type="submit">Register</button>
					</div>
					
					<p class="registration_response" id="registration_response" role="status"
						aria-live="polite"></p>
					</form>
				</section>
			</main>
		</div>
	</body>
</html>
