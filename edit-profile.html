<!doctype html>
<html lang="en">
  <head>
    <!--
    Milestone 2
    Author: Gunnar Ashworth
    File: edit-profile.html
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gunnar Ashworth" />
    <meta name="description" content="profile settings page for the user" />
    <title>Edit Profile</title>

    <link rel="stylesheet" href="edit-profile.css" />
    <script src="edit-profile.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Edit Profile</h1>
    </header>

    <main>
      <a href="profile.html">Back</a>

      <section class="profile-settings">
        <div class="pfp-settings">
          <strong>Profile picture</strong>
          <img src="default-pfp.png" id="pfp" alt="Current profile picture" />
        </div>

        <div class="username-settings">
          <strong>Username</strong>
          <span id="username">Username</span>
          <button type="button" id="change-username">Change</button>
        </div>
      </section>

      <!-- pop up window for when the user wants to change their username -->
      <!-- includes common restraints for usernames -->
      <dialog id="username-dialog">
        <h2>Change username</h2>

        <form id="username-form">
          <label for="new-username">New username</label>
          <input
            type="text"
            id="new-username"
            required
            minlength="3"
            maxlength="20"
            pattern="^[a-zA-Z0-9_]+$"
          />

          <!-- room to display message when username doesn't meet requirements -->
          <p id="username-message"></p>

          <button type="button" id="cancel-username">Back</button>
          <button type="submit" id="confirm-username">Confirm</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
