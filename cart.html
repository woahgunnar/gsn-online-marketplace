<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gunnar Ashworth" />
    <meta name="description" content="shopping cart page" />
    <title>Olde-Catalog - Cart</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/cart.css" />
  </head>

  <body>
    <!-- HEADER AND NAVIGATION -->
    <header>
      <div class="header-content">
        <div class="logo-window">
          <h1>
            <a href="index.html"
              ><img src="images/logo.webp" width="300" height="150" alt="logo"
            /></a>
          </h1>
        </div>

        <!-- navigation menu -->
        <nav aria-label="Main navigation">
          <a href="login.html">Sign in</a>
          <a href="index.html">Browse</a>
          <a href="messages.html">Messages</a>
          <a href="profile.php">Profile</a>
          <a href="cart.html">Cart</a>
        </nav>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="wooden-frame">
      <div class="parchment-panel">
        <img src="images/iron-rivet.png" class="nail-left" alt="nail" />
        <img src="images/iron-rivet.png" class="nail-right" alt="nail" />

        <!-- cart heading -->
        <div class="cart-heading">
          <h2>Your Shopping Cart</h2>
          <h3><em>Review the goods in your wagon before checking out.</em></h3>
        </div>

        <!-- CART LAYOUT -->
        <div class="cart-layout">
          <section class="cart-items">
            <h3>Items in your cart:</h3>

            <!-- comprehensive item list -->
            <ul class="cart-list">
              <!-- individual cart items -->
              <li class="cart-item">
                <img src="images/icon-cart.jpg" alt="placeholder" />
                <!-- cart item details -->
                <div class="item-details">
                  <h4>Placeholder</h4>
                  <p>$25.00</p>

                  <label for="quantity-1">Quantity</label>
                  <input id="quantity-1" type="number" min="1" value="1" />

                  <button type="button" class="remove-item leather-button">
                    Remove
                  </button>
                </div>
              </li>

              <li class="cart-item">
                <img src="images/icon-cart.jpg" alt="placeholder" />

                <div class="item-details">
                  <h4>Scooby Snacks</h4>
                  <p>Price: $15.00</p>

                  <label for="quantity-2">Quantity</label>
                  <input id="quantity-2" type="number" min="1" value="1" />

                  <button type="button" class="remove-item leather-button">
                    Remove
                  </button>
                </div>
              </li>
            </ul>
          </section>

          <!-- order summary -->
          <section class="order-summary">
            <h3>Order Summary</h3>

            <div class="summary-details">
              <strong>Total</strong>
              <strong>$40.00</strong>
            </div>

            <div class="checkout-button">
              <button type="button" class="leather-button">
                Proceed to Checkout
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-content">
        <p>&copy; 2026 Olde-Catalog</p>
        <a href="support.html">Help & Support</a>
      </div>
    </footer>
  </body>
</html>
