<!doctype html>
<html lang="en">
  <head>
    <!--
	Milestone 2
	Author: Sebastian Jeansonne
	File: registration.html
	-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sebastian Jeansonne" />
    <meta name="description" content="Register New User" />
    <title>Olde-Catalog - Login</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/login.css" />
    
    <script src="js/login.js" defer></script>
  </head>

  <body>
    <!-- HEADER AND NAVIGATION -->
    <header>
      <div class="header-content">
        <div class="logo-window">
          <h1>
            <a href="index.html"
              ><img src="images/logo.webp" width="300" height="150" alt="logo"
            /></a>
          </h1>
        </div>

        <!-- navigation menu -->
        <nav aria-label="Main navigation">
          <a href="login.html">Sign in</a>
          <a href="index.html">Browse</a>
          <a href="messages.html">Messages</a>
          <a href="profile.html">Profile</a>
          <a href="cart.html">Cart</a>
        </nav>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="wooden-frame">
      <div class="parchment-panel">
        <img src="images/iron-rivet.png" class="nail-left" alt="" />
        <img src="images/iron-rivet.png" class="nail-right" alt="" />

        <!-- page heading -->
        <div class="login-heading">
          <h2>Welcome Back, Merchant</h2>
          <h3><em>Log in to your Olde-Catalog account.</em></h3>
        </div>

        <!-- registration form -->
        <section class="login-panel">
          <form class="login-form" action="backend/login.php" method="post">
            <!-- username/email field -->
            <div class="login-field">
              <!-- email field -->
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
              />
            </div>

            <!-- password field -->
            <div class="login-field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
              />
            </div>

            <!-- room to display error message -->
            <p id="login-error" role="alert"></p>

            <!-- login button -->
            <div class="login-action">
              <button class="leather-button" type="submit">Sign in</button>
            </div>

            <!-- link to registration -->
            <p class="registration-link">
              <strong>
                Don't have an account?
                <a href="registration.html">Register here</a></strong
              >
            </p>
          </form>
        </section>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-content">
        <p>&copy; 2026 Olde-Catalog</p>
        <a href="support.html">Help & Support</a>
      </div>
    </footer>
  </body>
</html>
